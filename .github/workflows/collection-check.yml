name: Collection check

# Ready pull requests are checked once per push, and a newer push cancels the
# older run; draft pull requests are skipped until marked ready. main is checked
# after each merge; any other branch, a draft's included, runs by hand (Actions
# tab, or `gh workflow run`).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# A pull request's runs share a group, so a newer push cancels the older run.
# Every other run gets its own group: a shared group keeps only one pending
# run, which would drop queued pushes to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  collection-check:
    name: Collection check (${{ matrix.os }})
    # Skipped on draft pull requests; ready_for_review starts the real run.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # ID stability checks compare against the last release tag.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned agnix
        run: npm ci
      - name: Verify release candidates offline
        run: node scripts/release/dry-run.js
      - name: Run collection check fixtures
        run: node scripts/check/test/run.js
      - name: Run gate writer tests
        run: node scripts/gates/test/run.js
      - name: Run drift script fixtures
        run: node scripts/vendor/test/run.js
      - name: Check collection
        run: node scripts/check/check.js

  security-scan:
    name: Security scan (${{ matrix.os }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan diffs against the push's or pull request's base commit.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.6'
      - name: Run security scan fixtures
        run: node scripts/security-scan/test/run.js
      - name: Scan changed skill and hook files
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          # A manual run has no base; a force push to main may drop its before commit.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="origin/$DEFAULT_BRANCH"
          fi
          uv run scripts/security-scan/scan.py --base "$base"
