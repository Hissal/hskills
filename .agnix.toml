# agnix, on trial beside the collection check (#93). The check runs it with
# this file; see docs/skill-format.md, "agnix (on trial)". Pinned in
# package.json. Autofix is never run.

# Harness format rules for the two harnesses the collection targets.
tools = ["claude-code", "codex"]

[rules]
# Wording-opinion rules, off for good (#77, catalog S32): every PE-*.
prompt_engineering = false
# Off per #77. AGM-002 and AGM-004 are wording-opinion rules, off for good.
# Also off per #77, but retired upstream by the pinned version, so not listed
# (agnix warns about retired IDs): CC-MEM-005 to 009, CDX-AG-004.
disabled_rules = ["CX-SK-001", "XP-SK-001", "AGM-002", "AGM-004"]
